name: abess_vpn
description: AbessVPN Commercial Edition - Cyber Xray VLESS Client with Token Protection, SNI Host Injection and Anti-Tamper Security
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_v2ray: ^1.0.10
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  fl_chart: ^0.68.0
  url_launcher: ^6.1.7
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/abess_vpn_logo.svg
    - assets/abess_vpn_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/abess_vpn_logo.png"
  min_sdk_android: 21
