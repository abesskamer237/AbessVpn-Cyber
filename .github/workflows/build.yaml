name: Build Ultralight APK (< 25MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          if [ ! -f "android/gradlew" ] || [ ! -f "android/app/build.gradle" ]; then
            echo "Android project missing. Generating platform files..."
            rm -rf android
            flutter create . --org com.abessvpn --project-name abess_vpn --platforms=android
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/minSdkVersion.*/minSdkVersion 21/" android/app/build.gradle || true
            sed -i "s/minSdk .*/minSdk 21/" android/app/build.gradle || true
            # Enable R8 shrinking and optimize native libs
            sed -i "s/minifyEnabled false/minifyEnabled true/" android/app/build.gradle || true
            sed -i "s/shrinkResources false/shrinkResources true/" android/app/build.gradle || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Render VPN logo PNG from SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/abess_vpn_logo.svg -o assets/logo.png

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Ultralight APKs (< 25MB via split-per-abi & tree-shaking)
        run: |
          # Split-per-ABI builds individual architecture APKs under 25MB instead of 75MB fat APK
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Inspect and Rename Ultralight APKs
        shell: bash
        run: |
          echo "=== Taille des APK générés ==="
          ls -lh build/app/outputs/flutter-apk/*.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/AbessVpn-arm64-v8a-ultra-light.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/AbessVpn-armeabi-v7a-ultra-light.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: AbessVpn-UltraLight-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
