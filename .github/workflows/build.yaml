name: Build ABESS VPN (CI and signed APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          # Generate Android platform files only if the app module is missing.
          # Never delete or overwrite an existing Android project just to obtain
          # the Gradle wrapper (the manifest, package ID and native config matter).
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android app module missing; generating platform files..."
            flutter create . --org com.abessvpn --project-name abess_vpn --platforms=android
          fi

          # Flutter projects may omit wrapper scripts/jar from version control.
          # Create them in a disposable scaffold, then copy only the wrapper files.
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Creating missing Gradle wrapper without replacing the Android project..."
            tmp_dir="$(mktemp -d)"
            flutter create --no-pub --org com.abessvpn --project-name abess_wrapper_seed --platforms=android "$tmp_dir/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp_dir/seed/android/gradlew" android/gradlew
            cp "$tmp_dir/seed/android/gradlew.bat" android/gradlew.bat
            cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
              cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            fi
            chmod +x android/gradlew
            rm -rf "$tmp_dir"
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/minSdkVersion.*/minSdkVersion 21/" android/app/build.gradle || true
            sed -i "s/minSdk .*/minSdk 21/" android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 21/" android/app/build.gradle.kts || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Render VPN logo PNG from SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/abess_vpn_logo.svg -o assets/abess_vpn_logo.png

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Configure persistent Android release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_STORE_PASSWORD:?Missing GitHub secret ANDROID_STORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          KEYSTORE_PATH="$RUNNER_TEMP/abess-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build APK (debug for pull requests, persistently signed release otherwise)
        shell: bash
        env:
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${VPN_DOMAIN:-}" ]; then
            echo "Set the repository variable VPN_DOMAIN before building: it is the API domain embedded in this APK." >&2
            exit 1
          fi
          if ! [[ "$VPN_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "VPN_DOMAIN must be a hostname only (no scheme, port, or path)." >&2
            exit 1
          fi
          # Obfuscate Dart symbols in the distributed APK. Keep symbols in the
          # runner workspace for private diagnostics; never publish them as an artifact.
          # Use the version declared by the Flutter project instead of a stale
          # hard-coded value, so the installed APK reports the correct release.
          VERSION_NAME="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read the app version from pubspec.yaml." >&2
            exit 1
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [[ "${REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${RELEASE_TAG#v}"
            if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must look like v2.1.0" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Pull requests (including forks without access to secrets) only need a compile check.
            # This debug APK is not an official release and must not be distributed as an update.
            flutter build apk --debug --no-tree-shake-icons \
              --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
              --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"
          else
            if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
              echo "Persistent Android release keystore is not configured." >&2
              exit 1
            fi
            flutter build apk --release --no-tree-shake-icons \
              --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
              --obfuscate \
              --split-debug-info=build/private-symbols/abess-vpn \
              --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: abess-vpn-${{ github.event_name == 'pull_request' && 'debug-pr' || 'release-signed' }}
          path: build/app/outputs/flutter-apk/app-*.apk
          if-no-files-found: error

