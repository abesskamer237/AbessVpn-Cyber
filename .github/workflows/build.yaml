name: Build APK Release (68MB Universal)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          # Generate Android platform files only if the app module is missing.
          # Never delete or overwrite an existing Android project just to obtain
          # the Gradle wrapper (the manifest, package ID and native config matter).
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android app module missing; generating platform files..."
            flutter create . --org com.abessvpn --project-name abess_vpn --platforms=android
          fi

          # Flutter projects may omit wrapper scripts/jar from version control.
          # Create them in a disposable scaffold, then copy only the wrapper files.
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Creating missing Gradle wrapper without replacing the Android project..."
            tmp_dir="$(mktemp -d)"
            flutter create --no-pub --org com.abessvpn --project-name abess_wrapper_seed --platforms=android "$tmp_dir/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp_dir/seed/android/gradlew" android/gradlew
            cp "$tmp_dir/seed/android/gradlew.bat" android/gradlew.bat
            cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
              cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            fi
            chmod +x android/gradlew
            rm -rf "$tmp_dir"
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/minSdkVersion.*/minSdkVersion 21/" android/app/build.gradle || true
            sed -i "s/minSdk .*/minSdk 21/" android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 21/" android/app/build.gradle.kts || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Render VPN logo PNG from SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/abess_vpn_logo.svg -o assets/abess_vpn_logo.png

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Universal Fat APK (~68MB Full Architecture)
        shell: bash
        env:
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${VPN_DOMAIN:-}" ]; then
            echo "Set the repository variable VPN_DOMAIN before building: it is the API domain embedded in this APK." >&2
            exit 1
          fi
          if ! [[ "$VPN_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "VPN_DOMAIN must be a hostname only (no scheme, port, or path)." >&2
            exit 1
          fi
          # Obfuscate Dart symbols in the distributed APK. Keep symbols in the
          # runner workspace for private diagnostics; never publish them as an artifact.
          flutter build apk --release --no-tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/private-symbols/abess-vpn \
            --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: abess-vpn-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
