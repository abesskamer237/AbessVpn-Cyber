name: Build ABESS VPN (CI and signed APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          # Generate Android platform files only if the app module is missing.
          # Never delete or overwrite an existing Android project just to obtain
          # the Gradle wrapper (the manifest, package ID and native config matter).
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android app module missing; generating platform files..."
            flutter create . --org com.abessvpn --project-name abess_vpn --platforms=android
          fi

          # Flutter projects may omit wrapper scripts/jar from version control.
          # Create them in a disposable scaffold, then copy only the wrapper files.
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Creating missing Gradle wrapper without replacing the Android project..."
            tmp_dir="$(mktemp -d)"
            flutter create --no-pub --org com.abessvpn --project-name abess_wrapper_seed --platforms=android "$tmp_dir/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp_dir/seed/android/gradlew" android/gradlew
            cp "$tmp_dir/seed/android/gradlew.bat" android/gradlew.bat
            cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
              cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            fi
            chmod +x android/gradlew
            rm -rf "$tmp_dir"
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/minSdkVersion.*/minSdkVersion 23/" android/app/build.gradle || true
            sed -i "s/minSdk .*/minSdk 23/" android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 23/" android/app/build.gradle.kts || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Render VPN logo PNG from SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/abess_vpn_logo.svg -o assets/abess_vpn_logo.png

      - name: Verify SSH TCP and WSS with the real Dart client
        shell: bash
        run: |
          set -euo pipefail
          ssh_test_node_dir="$RUNNER_TEMP/abess-ssh-client-test"
          npm install --prefix "$ssh_test_node_dir" --ignore-scripts --no-audit --no-fund ssh2@1.17.0 ws@8.22.0
          ssh_test_xray_container="abess-ssh-client-test-xray"
          trap 'docker rm -f "$ssh_test_xray_container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$ssh_test_xray_container" ghcr.io/xtls/xray-core:26.7.28 >/dev/null
          docker cp "$ssh_test_xray_container:/usr/local/bin/xray" "$RUNNER_TEMP/abess-ssh-test-xray"
          chmod 700 "$RUNNER_TEMP/abess-ssh-test-xray"
          ABESS_SSH_TEST_NODE_DIR="$ssh_test_node_dir" SSH_TEST_XRAY_BIN="$RUNNER_TEMP/abess-ssh-test-xray" dart run scripts/test_ssh_runtime.dart

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Configure persistent Android release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/abess-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using release keystore provided by GitHub secrets..."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            {
              echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Persistent release keystore verified."
          else
            echo "ANDROID_KEYSTORE_BASE64 is required for official releases; configure the persistent signing secrets." >&2
            exit 1
          fi

      - name: Build APK (debug for pull requests, persistently signed release otherwise)
        shell: bash
        env:
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          VPN_DOMAIN="${VPN_DOMAIN:?Set repository variable VPN_DOMAIN to your control-plane hostname}"
          [[ "$VPN_DOMAIN" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || { echo "VPN_DOMAIN must be a hostname without scheme, port or path." >&2; exit 1; }
          # Obfuscate Dart symbols in the distributed APK. Keep symbols in the
          # runner workspace for private diagnostics; never publish them as an artifact.
          # Use the version declared by the Flutter project instead of a stale
          # hard-coded value, so the installed APK reports the correct release.
          VERSION_NAME="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read the app version from pubspec.yaml." >&2
            exit 1
          fi
          VERSION_CODE="$(sed -n 's/^version: *[^+]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml | head -n1)"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versionCode." >&2; exit 1; }
          if [[ "${REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${RELEASE_TAG#v}"
            if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must look like v2.1.0" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Pull requests (including forks without access to secrets) only need a compile check.
            # This debug APK is not an official release and must not be distributed as an update.
            flutter build apk --debug --no-tree-shake-icons \
              --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
              --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"
          else
            if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
              echo "Persistent Android release keystore is not configured." >&2
              exit 1
            fi
            # 1. Build optimized per-ABI split APKs (arm64-v8a: ~20MB, armeabi-v7a: ~18MB)
            flutter build apk --release --split-per-abi --tree-shake-icons \
              --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
              --obfuscate \
              --split-debug-info=build/private-symbols/abess-vpn \
              --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"

            mkdir -p build/dist-apks
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/dist-apks/
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/dist-apks/

            # 2. Build universal APK
            flutter build apk --release --tree-shake-icons \
              --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
              --obfuscate \
              --split-debug-info=build/private-symbols/abess-vpn \
              --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"

            cp build/dist-apks/* build/app/outputs/flutter-apk/ || true
          fi

      - name: Verify release APK size and native packaging
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_apk_size.py build/app/outputs/flutter-apk/*.apk --report build/apk-size-report.json --markdown build/apk-size-report.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: abess-vpn-${{ github.event_name == 'pull_request' && 'debug-pr' || 'release-signed' }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/apk-size-report.json
            build/apk-size-report.md
          if-no-files-found: error

