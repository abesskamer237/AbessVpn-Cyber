name: Verify ABESS legacy API and source host hygiene

on:
  push:
    branches: [ main ]
    paths:
      - "server.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-legacy-api.yml"
      - "lib/main.dart"
  pull_request:
    branches: [ main ]
    paths:
      - "server.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-legacy-api.yml"
      - "lib/main.dart"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node API dependencies
        run: npm ci

      - name: Type-check the Node API
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --skipLibCheck server.ts

      - name: Reject legacy demo hostnames and SNI values
        shell: bash
        run: |
          set -euo pipefail
          if grep -nEi 'run[.]app|ai[.]studio|crashlyticsreports-pa[.]googleapis[.]com|konoyves[.]shop|abess-ops-hub-d-ploiement-docker|server[.]nexustunnel[.]me|152[.]70[.]40[.]192|79[.]76[.]109[.]186|badCertificateCallback|HttpOverrides' lib/main.dart; then
            echo "Remove retired API hosts and all certificate-validation bypasses from the Android client." >&2
            exit 1
          fi
          if grep -nF "configured.startsWith('http://')" lib/main.dart; then
            echo "The Android client must not accept an HTTP API base URL." >&2
            exit 1
          fi
          grep -qF "!configured.startsWith('https://')" lib/main.dart
          grep -qF "parsed.scheme != 'https'" lib/main.dart
