name: Publish ABESS VPN Android Release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (example: v2.1.0; leave the tag on the selected ref)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG_INPUT:-}" ]; then
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            VERSION_NAME="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
            if [ -z "$VERSION_NAME" ]; then
              echo "Unable to read the app version from pubspec.yaml." >&2
              exit 1
            fi
            RELEASE_TAG="v$VERSION_NAME"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Use a version tag like v2.1.0." >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Avoid republishing an unchanged main version
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ "$IS_MAIN_PUSH" = "true" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; a normal main push must not overwrite a published APK."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        if: steps.guard.outputs.publish == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Validate release version and API domain
        if: steps.guard.outputs.publish == 'true'
        env:
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Use a version tag like v2.1.0"; exit 1; }
          VPN_DOMAIN="${VPN_DOMAIN:-panel.pagnol.xyz}"
          [[ "$VPN_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Set repository variable VPN_DOMAIN to a hostname only."; exit 1; }

      - name: Prepare Android project
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --org com.abessvpn --project-name abess_vpn --platforms=android
          fi
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmp_dir="$(mktemp -d)"
            flutter create --no-pub --org com.abessvpn --project-name abess_wrapper_seed --platforms=android "$tmp_dir/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp_dir/seed/android/gradlew" android/gradlew
            cp "$tmp_dir/seed/android/gradlew.bat" android/gradlew.bat
            cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            [ -f android/gradle/wrapper/gradle-wrapper.properties ] || cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew
            rm -rf "$tmp_dir"
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i "s/minSdkVersion.*/minSdkVersion 21/" android/app/build.gradle || true
            sed -i "s/minSdk .*/minSdk 21/" android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 21/" android/app/build.gradle.kts || true
          fi

      - name: Configure persistent Android release signing
        if: steps.guard.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/abess-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using release keystore provided by GitHub secrets..."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_STORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Persistent release keystore is present and the configured alias was found."
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not found; generating dedicated release keystore..."
            STORE_PASS="AbessVpn2026CommercialReleaseSecretKey!"
            KEY_ALIAS="abesskey"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=AbessVpn, OU=Commercial, O=Abess, L=Yaounde, ST=Centre, C=CM"
            chmod 600 "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "Fallback release keystore generated successfully."
          fi
      - name: Install dependencies
        if: steps.guard.outputs.publish == 'true'
        run: flutter pub get

      - name: Prepare app icon
        if: steps.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/abess_vpn_logo.svg -o assets/abess_vpn_logo.png

      - name: Run Flutter tests
        if: steps.guard.outputs.publish == 'true'
        run: flutter test --no-pub

      - name: Generate launcher icons
        if: steps.guard.outputs.publish == 'true'
        run: dart run flutter_launcher_icons

      - name: Build release APK
        if: steps.guard.outputs.publish == 'true'
        env:
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Persistent Android release keystore is not configured." >&2
            exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          # 1. Build optimized per-ABI split APKs (arm64-v8a: ~20MB, armeabi-v7a: ~18MB)
          flutter build apk --release --split-per-abi --no-tree-shake-icons \
            --build-name="$VERSION_NAME" --build-number="$GITHUB_RUN_NUMBER" \
            --obfuscate \
            --split-debug-info=build/private-symbols/abess-vpn \
            --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"

          # 2. Build universal ARM APK (arm64 + arm32 without x86 emulator bloat: ~35MB)
          flutter build apk --release --no-tree-shake-icons \
            --build-name="$VERSION_NAME" --build-number="$GITHUB_RUN_NUMBER" \
            --obfuscate \
            --split-debug-info=build/private-symbols/abess-vpn \
            --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"

      - name: Prepare release asset
        if: steps.guard.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Main official APK: arm64-v8a (~20MB, for 98% of modern phones):
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "ABESS-VPN-${RELEASE_TAG}.apk"
          # Also explicit arm64 naming:
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "ABESS-VPN-${RELEASE_TAG}-arm64.apk"
          # 32-bit legacy asset:
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "ABESS-VPN-${RELEASE_TAG}-arm32.apk"
          # Universal ARM asset (both 64-bit and 32-bit):
          cp build/app/outputs/flutter-apk/app-release.apk "ABESS-VPN-${RELEASE_TAG}-universal.apk"
          ls -lh ABESS-VPN-*.apk

      - name: Publish GitHub Release
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$IS_MAIN_PUSH" = "true" ]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
                --title "ABESS VPN $RELEASE_TAG" \
                --notes "Version Android ABESS VPN optimisée (taille ultra-réduite de 68 Mo à ~20 Mo). Compatible avec tous les smartphones Android."
            else
              gh release create "$RELEASE_TAG" \
                --title "ABESS VPN $RELEASE_TAG" \
                --notes "Version Android ABESS VPN optimisée (taille ultra-réduite de 68 Mo à ~20 Mo). Compatible avec tous les smartphones Android."
            fi
          fi
          gh release upload "$RELEASE_TAG" ABESS-VPN-*.apk --clobber
