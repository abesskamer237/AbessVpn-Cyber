name: Publish ABESS VPN Android Release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (example: v2.1.0; leave the tag on the selected ref)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG_INPUT:-}" ]; then
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            VERSION_NAME="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
            if [ -z "$VERSION_NAME" ]; then
              echo "Unable to read the app version from pubspec.yaml." >&2
              exit 1
            fi
            RELEASE_TAG="v$VERSION_NAME"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Use a version tag like v2.1.0." >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Avoid republishing an unchanged main version
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ "$IS_MAIN_PUSH" = "true" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; a normal main push must not overwrite a published APK."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        if: steps.guard.outputs.publish == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Validate release version and API domain
        if: steps.guard.outputs.publish == 'true'
        env:
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Use a version tag like v2.1.0"; exit 1; }
          VPN_DOMAIN="${VPN_DOMAIN:?Set repository variable VPN_DOMAIN to your control-plane hostname}"
          [[ "$VPN_DOMAIN" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || { echo "VPN_DOMAIN must be a hostname without scheme, port or path." >&2; exit 1; }

      - name: Prepare Android project
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --org com.abessvpn --project-name abess_vpn --platforms=android
          fi
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmp_dir="$(mktemp -d)"
            flutter create --no-pub --org com.abessvpn --project-name abess_wrapper_seed --platforms=android "$tmp_dir/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp_dir/seed/android/gradlew" android/gradlew
            cp "$tmp_dir/seed/android/gradlew.bat" android/gradlew.bat
            cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            [ -f android/gradle/wrapper/gradle-wrapper.properties ] || cp "$tmp_dir/seed/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew
            rm -rf "$tmp_dir"
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i "s/minSdkVersion.*/minSdkVersion 23/" android/app/build.gradle || true
            sed -i "s/minSdk .*/minSdk 23/" android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 23/" android/app/build.gradle.kts || true
          fi

      - name: Configure persistent Android release signing
        if: steps.guard.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/abess-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using release keystore provided by GitHub secrets..."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_STORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null
            {
              echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Persistent release keystore is present and the configured alias was found."
          else
            echo "ANDROID_KEYSTORE_BASE64 is required for official releases; configure the persistent signing secrets." >&2
            exit 1
          fi
      - name: Install dependencies
        if: steps.guard.outputs.publish == 'true'
        run: flutter pub get

      - name: Prepare app icon
        if: steps.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/abess_vpn_logo.svg -o assets/abess_vpn_logo.png

      - name: Verify SSH TCP and WSS with the real Dart client
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh_test_node_dir="$RUNNER_TEMP/abess-ssh-client-test"
          npm install --prefix "$ssh_test_node_dir" --ignore-scripts --no-audit --no-fund ssh2@1.17.0 ws@8.22.0
          ssh_test_xray_container="abess-ssh-client-test-xray"
          trap 'docker rm -f "$ssh_test_xray_container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$ssh_test_xray_container" ghcr.io/xtls/xray-core:26.7.28 >/dev/null
          docker cp "$ssh_test_xray_container:/usr/local/bin/xray" "$RUNNER_TEMP/abess-ssh-test-xray"
          chmod 700 "$RUNNER_TEMP/abess-ssh-test-xray"
          ABESS_SSH_TEST_NODE_DIR="$ssh_test_node_dir" SSH_TEST_XRAY_BIN="$RUNNER_TEMP/abess-ssh-test-xray" dart run scripts/test_ssh_runtime.dart

      - name: Run Flutter tests
        if: steps.guard.outputs.publish == 'true'
        run: flutter test --no-pub

      - name: Generate launcher icons
        if: steps.guard.outputs.publish == 'true'
        run: dart run flutter_launcher_icons

      - name: Build release APK
        if: steps.guard.outputs.publish == 'true'
        env:
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Persistent Android release keystore is not configured." >&2
            exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          DECLARED_VERSION="$(sed -n 's/^version: *\([^+ ]*\)+.*/\1/p' pubspec.yaml | head -n1)"
          VERSION_CODE="$(sed -n 's/^version: *[^+]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml | head -n1)"
          [ "$VERSION_NAME" = "$DECLARED_VERSION" ] || { echo "Release tag must match pubspec.yaml version." >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versionCode." >&2; exit 1; }
          VPN_DOMAIN="${VPN_DOMAIN:?Set repository variable VPN_DOMAIN to your control-plane hostname}"
          # 1. Build optimized per-ABI split APKs (arm64-v8a: ~20MB, armeabi-v7a: ~18MB)
          flutter build apk --release --split-per-abi --no-tree-shake-icons \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --obfuscate \
            --split-debug-info=build/private-symbols/abess-vpn \
            --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"

          mkdir -p build/dist-apks
          # Main official APK: arm64-v8a (~20MB, for 98% of modern phones):
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/dist-apks/"ABESS-VPN-${RELEASE_TAG}.apk"
          # Explicit arm64 naming:
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/dist-apks/"ABESS-VPN-${RELEASE_TAG}-arm64.apk"
          # 32-bit legacy asset:
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/dist-apks/"ABESS-VPN-${RELEASE_TAG}-arm32.apk"

          # 2. Build universal APK (contains all ABIs for universal compatibility)
          flutter build apk --release --no-tree-shake-icons \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --obfuscate \
            --split-debug-info=build/private-symbols/abess-vpn \
            --dart-define="ABESS_API_BASE_URL=https://$VPN_DOMAIN"

          cp build/app/outputs/flutter-apk/app-release.apk build/dist-apks/"ABESS-VPN-${RELEASE_TAG}-universal.apk"

      - name: Prepare release asset
        if: steps.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cp build/dist-apks/*.apk .
          ls -lh ABESS-VPN-*.apk

      - name: Verify APK signatures and create checksum manifest
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -n "$apksigner"
          for apk in ABESS-VPN-*.apk; do "$apksigner" verify "$apk"; done
          sha256sum ABESS-VPN-*.apk > SHA256SUMS

      - name: Attest signed APK provenance
        if: steps.guard.outputs.publish == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ABESS-VPN-*.apk

      - name: Publish GitHub Release
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$IS_MAIN_PUSH" = "true" ]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
                --title "ABESS VPN $RELEASE_TAG" \
                --notes "Version Android ABESS VPN optimisée (taille ultra-réduite de 68 Mo à ~20 Mo). Compatible avec tous les smartphones Android."
            else
              gh release create "$RELEASE_TAG" \
                --title "ABESS VPN $RELEASE_TAG" \
                --notes "Version Android ABESS VPN optimisée (taille ultra-réduite de 68 Mo à ~20 Mo). Compatible avec tous les smartphones Android."
            fi
          fi
          gh release upload "$RELEASE_TAG" ABESS-VPN-*.apk SHA256SUMS --clobber
